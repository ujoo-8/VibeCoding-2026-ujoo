<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>2026년 하반기 한미그룹 공개채용</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css"
    />
    <style>
      /* CSS 변수구역 */
      /* :root{변수코드
            1. 변수설정방법
            --변수명: 값;
            변수명은 케밥케이스로 주로 씀
            (케밥케이스란? 마이너스 기호로 연결된 변수법)
            2. 변수호출방법
            var(변수명)
            쓰고 싶은 곳에 값으로 변수를 사용함.
            } */
      :root {
        --black: #000;
        --white: #fff;
        --red: #e60012;
        --red-grad: linear-gradient(90deg, #e60012 0%, #ff5d32 100%);
        --font:
          "Pretendard", "Inter", "Noto Sans KR", "Apple SD Gothic Neo",
          "Malgun Gothic", sans-serif;
        --ease: 0.2s ease;
        --wide: 1920px;
        --inner: 1440px;
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html {
        scroll-behavior: smooth;
      }
      body {
        margin: 0;
        font-family: var(--font);
        color: var(--black);
        background: var(--white);
        -webkit-font-smoothing: antialiased;
        word-break: keep-all;
      }
      h1,
      h2,
      p,
      ul {
        margin: 0;
        padding: 0;
      }
      ul {
        list-style: none;
      }
      a {
        color: inherit;
        text-decoration: none;
        transition:
          color var(--ease),
          background-color var(--ease),
          border-color var(--ease),
          opacity var(--ease);
      }
      img {
        display: block;
        max-width: 100%;
      }
      :focus-visible {
        outline: 3px solid var(--red);
        outline-offset: 3px;
      }

      /* ===== Header ===== */
      .header {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        height: 100px;
        z-index: 10;
      }
      .header__inner {
        max-width: var(--inner);
        height: 100%;
        margin: 0 auto;
        padding: 0 60px;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .logo {
        display: block;
        width: 182px;
        height: 31px;
      }
      .logo img {
        width: 182px;
        height: 31px;
      }
      .gnb {
        display: flex;
        align-items: center;
        height: 100%;
      }
      .gnb__list {
        display: flex;
        gap: 40px;
        height: 100%;
      }
      .gnb__item {
        display: flex;
        align-items: center;
        height: 100%;
      }
      .gnb__link {
        font-size: 19.1px;
        line-height: 20px;
        font-weight: 600;
        letter-spacing: -0.4px;
        white-space: nowrap;
      }
      .gnb__link:hover,
      .gnb__link:focus-visible {
        color: var(--red);
      }
      .gnb__cta {
        margin-left: 40px;
      }
      /* 모바일 전용 요소: 데스크탑/태블릿에서는 숨김 */
      .gnb__toggle,
      .gnb__item--cta {
        display: none;
      }

      /* ===== Buttons ===== */
      .btn {
        position: relative;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        border-radius: 500px;
        font-weight: 600;
        color: var(--white);
        border: 2px solid transparent;
        overflow: hidden;
        isolation: isolate;
        cursor: pointer;
        transition:
          color var(--ease),
          background-color var(--ease),
          border-color var(--ease);
      }
      .btn::before {
        content: "";
        position: absolute;
        inset: 0;
        z-index: -1;
        transition: opacity var(--ease);
      }
      .btn--sm {
        gap: 10px;
        height: 48px;
        padding: 0 18px 0 18px;
        font-size: 17.4px;
        line-height: 18px;
        letter-spacing: -0.36px;
        background: var(--red);
        border-color: var(--red);
      }
      .btn--sm:hover,
      .btn--sm:focus-visible {
        background: var(--white);
        color: var(--red);
      }
      .btn--sm svg {
        width: 7px;
        height: 12px;
        flex: none;
      }
      .btn--lg {
        width: 303px;
        height: 72px;
        font-size: 22.7px;
        line-height: 34px;
        letter-spacing: -0.48px;
        background: var(--white);
        border-color: transparent;
      }
      .btn--lg::before {
        background: var(--red-grad);
      }
      .btn--lg:hover,
      .btn--lg:focus-visible {
        color: var(--red);
        border-color: var(--red);
      }
      .btn--lg:hover::before,
      .btn--lg:focus-visible::before {
        opacity: 0;
      }

      /* ===== Main visual ===== */
      .mv {
        position: relative;
        height: 900px;
        min-height: 720px;
        overflow: hidden;
        background: #fff1ec url(./images/mv_bg.png) center/cover no-repeat;
      }
      .mv__inner {
        position: relative;
        max-width: var(--inner);
        height: 100%;
        margin: 0 auto;
        padding: 0 100px;
        display: flex;
        align-items: center;
      }
      .mv__text {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 80px;
        width: 560px;
        position: relative;
        z-index: 2;
      }
      .mv__copy {
        display: flex;
        flex-direction: column;
        gap: 31.9px;
      }
      .mv__season {
        font-size: 31.1px;
        line-height: 45px;
        font-weight: 700;
        letter-spacing: -0.64px;
      }
      .mv__title {
        display: flex;
        flex-direction: column;
      }
      .mv__brand {
        font-size: 72.3px;
        line-height: 76px;
        font-weight: 800;
        letter-spacing: -1.76px;
      }
      .mv__job {
        font-size: 45.8px;
        line-height: 72px;
        font-weight: 800;
        letter-spacing: -1.12px;
      }
      .mv__period {
        font-size: 19.2px;
        line-height: 28px;
        font-weight: 500;
        letter-spacing: -0.4px;
      }

      /* art stage: 겹침 구성이라 이 영역 안에서만 absolute 사용 */
      .mv__art {
        position: absolute;
        top: 100px;
        right: 0;
        width: 740px;
        height: 660px;
        pointer-events: none;
        z-index: 1;
      }
      .mv__art img,
      .mv__art .star {
        position: absolute;
      }
      .ring {
        position: absolute;
        border-radius: 500px;
      }
      .ring--glow {
        left: 0;
        top: 18px;
        width: 663px;
        height: 663px;
        border: 5px solid var(--white);
        filter: blur(5px);
        background: radial-gradient(
          70.71% 70.71% at 50% 50%,
          rgba(255, 255, 255, 0.2) 0%,
          rgba(255, 255, 255, 0) 100%
        );
      }
      .ring--line {
        left: 55px;
        top: 73px;
        width: 553px;
        height: 553px;
        border: 1px solid rgba(255, 255, 255, 0.5);
      }
      .mv__art .micro {
        left: 66px;
        top: 52px;
        width: 289.5px;
        height: 221.8px;
      }
      .mv__art .char1 {
        left: 115px;
        top: 195px;
        width: 253.4px;
        height: 395.1px;
      }
      .mv__art .char2 {
        left: 337px;
        top: 193px;
        width: 181.3px;
        height: 381px;
      }
      .mv__art .char3 {
        left: 39px;
        top: 369px;
        width: 216.5px;
        height: 262.2px;
      }
      .mv__art .char4 {
        left: 396px;
        top: 390px;
        width: 292.2px;
        height: 206.8px;
      }
      .star {
        display: block;
      }
      .star svg {
        display: block;
        width: 100%;
        height: 100%;
      }
      .star--white {
        left: 222px;
        top: 137px;
        width: 17.6px;
        height: 17.6px;
      }
      .star--red {
        left: 461px;
        top: 149px;
        width: 24px;
        height: 25px;
      }
      .star--yellow-l {
        left: 633px;
        top: 332px;
        width: 34px;
        height: 35px;
      }
      .star--yellow-s {
        left: 615px;
        top: 375px;
        width: 21px;
        height: 21px;
      }
      .star--purple {
        left: 40px;
        top: 370px;
        width: 23px;
        height: 24px;
      }
      @media (prefers-reduced-motion: no-preference) {
        .star {
          animation: twinkle 3.2s ease-in-out infinite;
        }
        .star--red {
          animation-delay: 0.6s;
        }
        .star--yellow-l {
          animation-delay: 1.2s;
        }
        .star--yellow-s {
          animation-delay: 1.8s;
        }
        .star--purple {
          animation-delay: 2.4s;
        }
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.55;
          transform: scale(0.85);
        }
      }

      /* scroll button */
      .scroll {
        position: absolute;
        left: 50%;
        bottom: 64px;
        transform: translateX(-50%);
        z-index: 3;
        width: 80px;
        height: 80px;
        padding: 0;
        border: 0;
        border-radius: 500px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        isolation: isolate;
        background: linear-gradient(
          132.3deg,
          rgba(255, 255, 255, 0.8) 12.7%,
          rgba(255, 255, 255, 0) 86.3%
        );
        box-shadow:
          inset 4px 4px 10px rgba(255, 255, 255, 0.4),
          inset -4px -4px 10px rgba(0, 0, 0, 0.1);
        -webkit-backdrop-filter: blur(5px);
        backdrop-filter: blur(5px);
        transition:
          background-color var(--ease),
          box-shadow var(--ease);
      }
      .scroll::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: inherit;
        background: rgba(255, 255, 255, 0.1);
        z-index: -1;
        transition: background-color var(--ease);
      }
      .scroll svg {
        width: 40px;
        height: 40px;
        stroke: var(--white);
        transition: stroke var(--ease);
      }
      .scroll:hover::before,
      .scroll:focus-visible::before {
        background: var(--white);
      }
      .scroll:hover svg,
      .scroll:focus-visible svg {
        stroke: var(--red);
      }

      /* ===== Footer ===== */
      .footer {
        background: #f5f5f5;
      }
      .footer__inner {
        max-width: var(--inner);
        margin: 0 auto;
        padding: 40px 60px;
      }
      .footer__copy {
        font-size: 14px;
        line-height: 20px;
        letter-spacing: -0.3px;
        color: #555;
      }

      /* ===== 반응형 (1440 미만에서 축소) ===== */
      @media (max-width: 1280px) {
        .mv__art {
          transform: scale(0.82);
          transform-origin: right center;
          right: -20px;
        }
        .gnb__list {
          gap: 28px;
        }
      }
      /* ===== Tablet: 1024px 이하 ===== */
      @media (max-width: 1024px) {
        /* header: 1024px 기준 값에서 화면이 좁아질수록 함께 줄어듦 */
        .header {
          height: 96px;
        }
        .header__inner {
          padding: 0 clamp(20px, 3.9vw, 40px);
        }
        .logo {
          width: clamp(110px, 14.8vw, 152px);
          height: auto;
          aspect-ratio: 182 / 31;
        }
        .logo img {
          width: 100%;
          height: 100%;
        }
        .gnb__list {
          gap: clamp(16px, 2.93vw, 30px);
        }
        .gnb__link {
          font-size: clamp(13px, 1.6vw, 16.5px);
        }
        .gnb__cta {
          margin-left: clamp(14px, 2.34vw, 24px);
          height: 44px;
          padding: 0 clamp(14px, 1.95vw, 20px);
          font-size: clamp(13px, 1.56vw, 16px);
          line-height: 18px;
        }
        .footer__inner {
          padding: 32px 40px;
        }

        /* main visual: 텍스트 위 / 일러스트 아래(중앙) 세로 배치 */
        .mv {
          /* height: 720px; */
          min-height: 0;
          padding-top: 96px;
        }
        .mv__inner {
          flex-direction: column;
          align-items: flex-start;
          justify-content: flex-start;
          padding: 0 40px;
        }
        .mv__text {
          width: 100%;
          gap: 40px;
        }
        .mv__copy {
          gap: 22px;
        }
        .mv__season {
          font-size: 27px;
          line-height: 40px;
          letter-spacing: -0.55px;
        }
        .mv__brand {
          font-size: 56px;
          line-height: 60px;
          letter-spacing: -1.36px;
        }
        .mv__job {
          font-size: 34px;
          line-height: 52px;
          letter-spacing: -0.83px;
        }
        .btn--lg {
          height: 64px;
          font-size: 20px;
          line-height: 30px;
          letter-spacing: -0.42px;
        }

        /* art: 740x660 스테이지를 비율 유지하며 축소 (좁아지면 화면 폭에 맞춰 함께 축소) */
        .mv__art {
          --art-scale: 0.72;
          position: relative;
          top: auto;
          right: auto;
          flex: none;
          align-self: center;
          transform: scale(var(--art-scale));
          transform-origin: top center;
          margin-bottom: calc(-660px * (1 - var(--art-scale)));
        }
        .scroll {
          bottom: 64px;
          width: 64px;
          height: 64px;
        }
        .scroll svg {
          width: 32px;
          height: 32px;
        }
      }
      @supports (width: calc(1px * tan(atan2(1px, 1px)))) {
        @media (max-width: 1024px) {
          .mv__art {
            --art-scale: min(0.72, tan(atan2(100vw, 740px)));
          }
        }
      }

      /* ===== 헤더 메뉴 전환: 600px 이하 (가로 메뉴가 들어갈 폭이 없어지는 지점) ===== */
      @media (max-width: 600px) {
        .header {
          height: 64px;
        }
        .header__inner {
          padding: 0 20px;
        }
        .logo,
        .logo img {
          width: 128px;
          height: 22px;
        }
        .gnb__cta {
          margin-left: 0;
          height: 28px;
          padding: 0 10px;
          font-size: 11px;
          line-height: 14px;
          letter-spacing: -0.22px;
        }
        .gnb__cta svg {
          display: none;
        }

        /* 햄버거 / 닫기 버튼 (터치 영역 40x40, 아이콘 20x20) */
        .gnb__toggle {
          display: flex;
          align-items: center;
          justify-content: center;
          width: 40px;
          height: 40px;
          margin: 0 -10px 0 2px;
          padding: 0;
          border: 0;
          background: none;
          color: var(--black);
          cursor: pointer;
        }
        .gnb__toggle svg {
          width: 20px;
          height: 20px;
        }
        .gnb__toggle .icon-close,
        .is-menu-open .gnb__toggle .icon-open {
          display: none;
        }
        .is-menu-open .gnb__toggle .icon-close {
          display: block;
        }

        /* 전체 메뉴: 오른쪽에서 슬라이드 (헤더 stacking context 안에서 로고/버튼 뒤에 깔림) */
        .is-menu-open {
          overflow: hidden;
        }
        .is-menu-open .header {
          position: fixed;
        }
        .is-menu-open .gnb__cta {
          visibility: hidden;
        }
        .gnb__list {
          position: fixed;
          inset: 0;
          z-index: -1;
          flex-direction: column;
          gap: 0;
          height: auto;
          padding: 105px 20px 0;
          overflow-y: auto;
          background: var(--white) url(./images/menu_char.png) no-repeat right
            14px bottom 33px / 143px auto;
          transform: translateX(100%);
          visibility: hidden;
          transition:
            transform 0.35s cubic-bezier(0.4, 0, 0.2, 1),
            visibility 0s linear 0.35s;
        }
        .is-menu-open .gnb__list {
          transform: translateX(0);
          visibility: visible;
          transition-delay: 0s;
        }
        .gnb__item {
          height: 62px;
          border-bottom: 1px solid #eee;
        }
        .gnb__link {
          display: flex;
          align-items: center;
          width: 100%;
          height: 100%;
          font-size: 20px;
          line-height: 24px;
          font-weight: 700;
          letter-spacing: -0.5px;
        }
        .gnb__item--cta {
          display: block;
          height: 50px;
          margin-top: 42px;
          border-bottom: 0;
        }
        .gnb__item--cta .btn {
          width: 100%;
          height: 100%;
        }

        .mv {
          height: auto;
          min-height: 720px;
          padding-bottom: 10px;
        }
        .scroll {
          bottom: 16px;
          width: 40px;
          height: 40px;
        }
        .scroll svg {
          width: 20px;
          height: 20px;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .gnb__list {
          transition: none;
        }
      }

      /* ===== Mobile: 390px 이하 ===== */
      @media (max-width: 390px) {
        .footer__inner {
          padding: 32px 20px;
        }
        .mv {
          height: auto;
          min-height: 770px;
          padding: 100px 0 10px;
        }
        .mv__inner {
          padding: 0 20px;
          gap: 12px;
        }
        .mv__text {
          gap: 52px;
        }
        .mv__copy {
          gap: 24px;
        }
        .mv__season {
          font-size: 20px;
          line-height: 28px;
          letter-spacing: -0.41px;
        }
        .mv__brand {
          font-size: 54px;
          line-height: 58px;
          letter-spacing: -1.31px;
        }
        .mv__job {
          font-size: 35px;
          line-height: 48px;
          letter-spacing: -0.86px;
        }
        .mv__period {
          font-size: 12px;
          line-height: 18px;
          letter-spacing: -0.25px;
        }
        .btn--lg {
          width: 200px;
          height: 48px;
          font-size: 14.5px;
          line-height: 22px;
          letter-spacing: -0.3px;
        }
      }

      /* ===== 미래 비주얼 섹션 ===== */
      .mirae {
        position: relative;
        min-height: 900px;
        height: 100svh;
        overflow: hidden;
        isolation: isolate;
        background: linear-gradient(180deg, #fff 0%, #fff8f6 31%, #ffe8e2 100%);
      }
      .mirae__title {
        position: absolute;
        z-index: 2;
        top: clamp(150px, 21.5%, 205px);
        left: 24px;
        right: 24px;
        margin: 0;
        text-align: center;
        font-size: clamp(38px, 5.25vw, 72px);
        line-height: 1.2;
        font-weight: 800;
        letter-spacing: -0.055em;
        white-space: nowrap;
        color: #f20b1b;
        background: linear-gradient(90deg, #ed0018 0%, #ff5d32 100%);
        -webkit-background-clip: text;
        background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .mirae__title-black {
        color: #000;
        background: none;
        -webkit-text-fill-color: #000;
      }
      .mirae__art {
        position: absolute;
        z-index: 1;
        left: 50%;
        bottom: -8.5%;
        width: min(1500px, 116vw);
        height: auto;
        max-width: none;
        transform: translateX(-50%);
        pointer-events: none;
      }
      .mirae__cloud {
        position: absolute;
        z-index: 0;
        height: auto;
        max-width: none;
        pointer-events: none;
      }
      .mirae__cloud--left-blur {
        width: clamp(180px, 29vw, 378px);
        left: 6%;
        top: 39%;
        filter: blur(7px);
        opacity: 0.72;
      }
      .mirae__cloud--left {
        width: clamp(210px, 32vw, 422px);
        left: -8%;
        top: 54%;
      }
      .mirae__cloud--right {
        width: clamp(350px, 53vw, 700px);
        right: -12%;
        top: 27%;
      }
      .mirae__cloud--right-blur {
        width: clamp(100px, 16vw, 200px);
        right: 16%;
        top: 67%;
        filter: blur(5px);
        opacity: 0.72;
      }
      .mirae__star {
        position: absolute;
        z-index: 2;
        height: auto;
        max-width: none;
        pointer-events: none;
      }
      .mirae__star--top {
        width: clamp(25px, 3.2vw, 42px);
        left: 62.5%;
        top: 70%;
      }
      .mirae__star--bottom {
        width: clamp(30px, 4vw, 52px);
        left: 31%;
        top: 78%;
      }

      @media (max-width: 1024px) {
        .mirae {
          min-height: 760px;
          height: 100svh;
        }
        .mirae__title {
          top: 20.5%;
          font-size: clamp(34px, 4.8vw, 60px);
        }
        .mirae__title-gradient {
          background: none;
          -webkit-text-fill-color: #f20b1b;
          color: #f20b1b;
        }
        .mirae__title-black {
          color: #000;
          -webkit-text-fill-color: #000;
        }
        .mirae__art {
          width: min(1500px, 145vw);
          bottom: -8%;
        }
        .mirae__cloud--left-blur {

    <script>
      (function () {
        var btn = document.querySelector("[data-scroll]");
        if (!btn) return;
        btn.addEventListener("click", function () {
          var hero = document.getElementById("main-visual");
          var next = hero.nextElementSibling;
          var top = next
            ? next.getBoundingClientRect().top + window.scrollY
            : hero.offsetHeight;
          window.scrollTo({ top: top, behavior: "smooth" });
        });
      })();

      /* 모바일 전체 메뉴 */
      (function () {
        var body = document.body;
        var toggle = document.querySelector(".gnb__toggle");
        var list = document.getElementById("gnb-list");
        if (!toggle || !list) return;

        function setMenu(open) {
          body.classList.toggle("is-menu-open", open);
          toggle.setAttribute("aria-expanded", String(open));
          toggle.setAttribute("aria-label", open ? "메뉴 닫기" : "메뉴 열기");
        }

        toggle.addEventListener("click", function () {
          setMenu(!body.classList.contains("is-menu-open"));
        });
        list.addEventListener("click", function (e) {
          if (e.target.closest("a")) setMenu(false);
        });
        document.addEventListener("keydown", function (e) {
          if (e.key === "Escape" && body.classList.contains("is-menu-open")) {
            setMenu(false);
            toggle.focus();
          }
        });
        /* 모바일 구간을 벗어나면(회전/리사이즈) 열린 메뉴 상태를 초기화 */
        window
          .matchMedia("(min-width: 601px)")
          .addEventListener("change", function (e) {
            if (e.matches) setMenu(false);
          });
      })();
    </script>
