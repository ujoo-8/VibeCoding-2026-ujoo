<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>한미그룹 2026년 하반기 공개채용</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+KR:wght@500;700;800&display=swap" rel="stylesheet">
  <style>
    /* ===== Design Tokens / CSS변수 구역 ===== */
    /*  :root{코드} 
      1. 변수설정방법
      --변수명 : 값;
      변수명은 케밥케이스로 주로 씀
      (케밥케이스란? 마이너스 기호로 연결된 변수법)
      2. 변수 호출방법
      var(변수명)
      쓰고 싶은 곳에 값으로 변수를 사용함.
    */
    :root {
      --red: #E60012;
      --orange: #FF5D32;
      --white: #FFFFFF;
      --black: #000000;
      --white-10: rgba(255, 255, 255, 0.1);
      --white-50: rgba(255, 255, 255, 0.5);
      --grad-cta: linear-gradient(90deg, #E60012 0%, #FF5D32 100%);
      --font: 'Inter', 'Noto Sans KR', 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      --container: 1440px;
      --header-h: 100px;
      --ease: 0.2s ease;
    }

    /* ===== Reset ===== */
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: var(--font);
      color: var(--black);
      background: var(--white);
      word-break: keep-all;
      overflow-wrap: break-word;
      -webkit-font-smoothing: antialiased;
    }
    h1, h2, p, ul { margin: 0; padding: 0; }
    ul { list-style: none; }
    a { color: inherit; text-decoration: none; }
    img { display: block; max-width: none; }
    button { font-family: inherit; cursor: pointer; }

    .sr-only {
      position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0;
      overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
    }

    /* ===== Header ===== */
    .header {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: var(--header-h);
      z-index: 10;
    }
    .header__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      max-width: var(--container);
      height: 100%;
      margin: 0 auto;
      padding: 0 60px;
    }
    .logo { display: block; width: 182px; height: 31px; }
    .logo img { width: 182px; height: 31px; }

    .gnb { display: flex; align-items: center; }
    .gnb__list { display: flex; align-items: center; gap: 40px; }
    .gnb__link {
      display: block;
      font-weight: 600;
      font-size: 19.2px;
      line-height: 20px;
      letter-spacing: -0.4px;
      color: var(--black);
      transition: color var(--ease);
    }
    .gnb__link:hover, .gnb__link:focus-visible { color: var(--red); }

    .gnb__apply { margin-left: 40px; }

    /* ===== Buttons (hover: 흰색 ↔ 빨강 반전) ===== */
    .btn {
      position: relative;
      isolation: isolate;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 2px solid var(--red);
      border-radius: 500px;
      color: var(--white);
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      background-color: var(--white);
      transition: color var(--ease), border-color var(--ease), background-color var(--ease);
    }
    /* 배경 레이어: 그라데이션도 부드럽게 전환되도록 opacity 로 처리 */
    .btn::before {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      background: var(--red);
      transition: opacity var(--ease);
    }
    .btn:hover, .btn:focus-visible { color: var(--red); }
    .btn:hover::before, .btn:focus-visible::before { opacity: 0; }

    .btn--sm {
      gap: 10px;
      height: 48px;
      padding: 0 20px;
      font-size: 17.4px;
      letter-spacing: -0.36px;
    }
    .btn--sm .chevron {
      width: 7px; height: 12px;
      flex: none;
    }
    .btn--sm .chevron path { stroke: currentColor; transition: stroke var(--ease); }

    .btn--lg {
      width: 303px;
      height: 72px;
      font-size: 22.7px;
      letter-spacing: -0.48px;
      border-color: transparent;
    }
    .btn--lg::before { background: var(--grad-cta); }
    .btn--lg:hover, .btn--lg:focus-visible { border-color: var(--red); }

    /* 모바일 전용 컨트롤 (데스크탑·태블릿에서는 숨김, 390px 이하에서 표시) */
    .header__apply, .gnb__toggle, .gnb__close { display: none; }

    /* ===== Main Visual ===== */
    .mv {
      position: relative;
      height: 900px;
      min-height: 720px;
      overflow: hidden;
      background: #FFE8E0 url("./images/mv_bg.png") center / cover no-repeat;
    }
    .mv__inner {
      position: relative;
      display: flex;
      align-items: center;
      max-width: var(--container);
      height: 100%;
      margin: 0 auto;
    }

    /* 좌측 텍스트 */
    .mv__text {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 80px;
      width: 560px;
      margin-left: 100px;
    }
    .mv__info { display: flex; flex-direction: column; gap: 31.9px; width: 442px; }
    .mv__season {
      font-weight: 700;
      font-size: 31.1px;
      line-height: 45px;
      letter-spacing: -0.64px;
    }
    .mv__title { display: flex; flex-direction: column; }
    .mv__title-em {
      font-weight: 800;
      font-size: 72.3px;
      line-height: 76px;
      letter-spacing: -1.76px;
    }
    .mv__title-sub {
      font-weight: 800;
      font-size: 45.8px;
      line-height: 72px;
      letter-spacing: -1.12px;
    }
    .mv__period {
      font-weight: 500;
      font-size: 19.2px;
      line-height: 28px;
      letter-spacing: -0.4px;
    }

    /* 우측 비주얼 (stage 기준 좌표) */
    .mv__visual {
      position: absolute;
      top: 0;
      left: 700px;
      width: 740px;
      height: 100%;
      z-index: 1;
    }
    .mv__visual > * { position: absolute; }

    .mv__glow {
      left: 0; top: 118px;
      width: 663px; height: 663px;
      background: radial-gradient(70.71% 70.71% at 50% 50%, rgba(255,255,255,0.2) 0%, rgba(255,255,255,0) 100%);
      border: 5px solid var(--white);
      border-radius: 500px;
      filter: blur(5px);
    }
    .mv__ring {
      left: 55px; top: 173px;
      width: 553px; height: 553px;
      border: 1px solid var(--white-50);
      border-radius: 500px;
    }
    .mv__micro { left: 65.8px;  top: 151.7px; width: 289.52px; height: 221.76px; }
    .mv__char1 { left: 115.1px; top: 295.1px; width: 253.44px; height: 395.12px; }
    .mv__char2 { left: 336.8px; top: 293.4px; width: 181.28px; height: 381.04px; }
    .mv__char3 { left: 39.4px;  top: 469.4px; width: 216.48px; height: 262.24px; }
    .mv__char4 { left: 395.8px; top: 490.5px; width: 292.16px; height: 206.8px; }

    /* 별 (CSS 4각 별) */
    .star {
      clip-path: polygon(50% 0, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0 50%, 38% 38%);
    }
    .star--1 { left: 221.6px; top: 237px;   width: 17.6px;  height: 16.72px; background: #9ADCF7; }
    .star--2 { left: 40px;    top: 469.4px; width: 22.88px; height: 23.76px; background: #A56BFF; }
    .star--3 { left: 614.9px; top: 474.6px; width: 21.12px; height: 21.12px; background: #FFC933; }
    .star--3b{ left: 632.5px; top: 432px;   width: 34.32px; height: 35.2px;  background: #FFC933; }
    .star--4 { left: 460.9px; top: 249px;   width: 23.76px; height: 24.64px; background: #FF4B2B; }

    /* 스크롤 버튼 */
    .scroll-btn {
      position: absolute;
      left: 50%;
      bottom: 64px;
      z-index: 3;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 80px; height: 80px;
      padding: 0;
      border: 0;
      border-radius: 500px;
      background: var(--white-10);
      box-shadow: inset 4px 4px 10px rgba(255,255,255,0.4), inset -4px -4px 10px rgba(0,0,0,0.1);
      -webkit-backdrop-filter: blur(5px);
      backdrop-filter: blur(5px);
      transition: background-color var(--ease);
    }
    .scroll-btn::before {
      content: "";
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(132.3deg, rgba(255,255,255,0.8) 12.7%, rgba(255,255,255,0) 86.3%);
      opacity: 0.5;
      pointer-events: none;
    }
    .scroll-btn:hover, .scroll-btn:focus-visible { background: rgba(230, 0, 18, 0.15); }
    .scroll-btn .chevron-down {
      position: relative;
      width: 40px; height: 40px;
    }
    .scroll-btn .chevron-down::after {
      content: "";
      position: absolute;
      left: 50%; top: 50%;
      width: 14px; height: 14px;
      border-right: 3px solid var(--white);
      border-bottom: 3px solid var(--white);
      transform: translate(-50%, -70%) rotate(45deg);
    }

    /* ===== Footer ===== */
    .footer {
      background: #F5F5F5;
      border-top: 1px solid rgba(0, 0, 0, 0.08);
    }
    .footer__inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      max-width: var(--container);
      margin: 0 auto;
      padding: 48px 60px;
    }
    .footer__logo { display: block; width: 120px; height: auto; }
    .footer__logo img { width: 120px; height: auto; }
    .footer__copy {
      font-weight: 500;
      font-size: 14px;
      line-height: 20px;
      letter-spacing: -0.2px;
      color: rgba(0, 0, 0, 0.6);
    }

    /* ===== Responsive (데스크톱 1440 기준 → 축소 대응) ===== */
    @media (max-width: 1280px) {
      .header__inner { padding: 0 32px; }
      .footer__inner { padding: 40px 32px; }
      .gnb__list { gap: 24px; }
      .gnb__apply { margin-left: 24px; }
      .mv__text { margin-left: 48px; }
      .mv__visual { transform: scale(0.85); transform-origin: left center; left: 52%; }
    }
    /* ===== Tablet (1024px 이하) ===== */
    @media (max-width: 1024px) {
      :root { --header-h: 96px; }

      /* 헤더: 로고·내비를 유동적으로 축소 */
      .header__inner { padding: 0 40px; }
      .logo, .logo img { width: clamp(110px, 14.6vw, 150px); height: auto; }
      .gnb__list { gap: clamp(14px, 2.9vw, 30px); }
      .gnb__link { font-size: clamp(12px, 1.66vw, 17px); }
      .gnb__apply { margin-left: clamp(12px, 2.1vw, 22px); }
      .btn--sm {
        gap: 8px;
        height: 44px;
        padding: 0 clamp(12px, 2vw, 20px);
        font-size: clamp(13px, 1.53vw, 15.7px);
        letter-spacing: -0.33px;
      }

      /* 메인 비주얼: 텍스트 위 → 비주얼 아래 세로 배치 */
      .mv { height: auto; min-height: 0; }
      .mv__inner {
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-start;
        height: auto;
        padding: var(--header-h) 0 96px;
      }
      .mv__text { width: auto; margin: 0 40px; gap: 40px; }
      .mv__info { width: auto; gap: 20px; }
      .mv__season { font-size: 27px; line-height: 42px; letter-spacing: -0.56px; }
      .mv__title-em { font-size: 57px; line-height: 58px; letter-spacing: -1.4px; }
      .mv__title-sub { font-size: 34px; line-height: 52px; letter-spacing: -0.83px; }
      .btn--lg { width: 298px; height: 64px; font-size: 20px; letter-spacing: -0.42px; }

      /* 우측 절대좌표 스테이지(740px) → 박스 기준 % 좌표로 변환해 폭에 맞춰 함께 축소 */
      .mv__visual {
        position: relative;
        top: auto; left: auto;
        width: min(500px, calc(100% - 40px));
        height: auto;
        aspect-ratio: 688 / 663;
        margin: 32px auto 0;
        transform: none;
      }
      .mv__glow  { left: 0;       top: 0;      width: 96.37%; height: 100%; }
      .mv__ring  { left: 7.99%;   top: 8.3%;   width: 80.38%; height: 83.41%; }
      .mv__micro { left: 9.56%;   top: 5.08%;  width: 42.08%; height: auto; }
      .mv__char1 { left: 16.73%;  top: 26.71%; width: 36.84%; height: auto; }
      .mv__char2 { left: 48.95%;  top: 26.46%; width: 26.35%; height: auto; }
      .mv__char3 { left: 5.73%;   top: 53%;    width: 31.47%; height: auto; }
      .mv__char4 { left: 57.53%;  top: 56.18%; width: 42.47%; height: auto; }
      .star--1  { left: 32.21%; top: 17.95%; width: 2.56%; height: 2.52%; }
      .star--2  { left: 5.81%;  top: 53%;    width: 3.33%; height: 3.58%; }
      .star--3  { left: 89.37%; top: 53.78%; width: 3.07%; height: 3.19%; }
      .star--3b { left: 91.93%; top: 47.36%; width: 4.99%; height: 5.31%; }
      .star--4  { left: 66.99%; top: 19.76%; width: 3.45%; height: 3.72%; }

      .scroll-btn { width: 56px; height: 56px; bottom: 24px; }

      .footer__inner { padding: 40px; }
    }

    /* ===== Mobile (390px 이하) ===== */
    @media (max-width: 768px) {
      :root { --header-h: 62px; }

      html.menu-open, html.menu-open body { overflow: hidden; }

      /* 헤더: 로고 + 지원하기 + 햄버거 */
      .header__inner { padding: 0 20px; }
      .logo, .logo img { width: 127px; height: auto; }

      .header__apply {
        display: inline-flex;
        margin-left: auto;
        height: 28px;
        padding: 0 8px;
        font-size: 12px;
        letter-spacing: -0.25px;
      }
      .gnb__toggle {
        display: block;
        flex: none;
        width: 44px; height: 44px;
        margin: 0 -12px 0 0;   /* 아이콘(20px) 우측이 20px 여백선에 맞도록 */
        padding: 0;
        border: 0;
        background:
          linear-gradient(var(--black), var(--black)) 50% 14px / 20px 2px no-repeat,
          linear-gradient(var(--black), var(--black)) 50% 21px / 20px 2px no-repeat,
          linear-gradient(var(--black), var(--black)) 50% 28px / 20px 2px no-repeat;
        -webkit-tap-highlight-color: transparent;
      }

      /* 전체 메뉴: 오른쪽에서 슬라이드 */
      .gnb {
        position: fixed;
        inset: 0;
        z-index: 20;
        display: block;
        padding: 112px 20px 0;
        overflow-y: auto;
        background: var(--white) url("./images/mo_menu_char.png") no-repeat right 16px bottom 16px / 153px auto;
        transform: translateX(100%);
        visibility: hidden;
        transition: transform 0.3s ease, visibility 0s linear 0.3s;
      }
      .gnb.is-open {
        transform: translateX(0);
        visibility: visible;
        transition-delay: 0s;
      }
      /* 메뉴 상단 로고 (헤더 로고가 패널에 가려지므로 동일 위치에 재현) */
      .gnb::before {
        content: "";
        position: absolute;
        top: 20px; left: 20px;
        width: 127px; height: 22px;
        background: url("./images/logo.svg") no-repeat left center / contain;
      }
      .gnb__close {
        position: absolute;
        top: 9px; right: 8px;
        display: block;
        width: 44px; height: 44px;
        padding: 0;
        border: 0;
        background: none;
        -webkit-tap-highlight-color: transparent;
      }
      .gnb__close::before, .gnb__close::after {
        content: "";
        position: absolute;
        left: 50%; top: 50%;
        width: 22px; height: 2px;
        background: var(--black);
        transform: translate(-50%, -50%) rotate(45deg);
      }
      .gnb__close::after { transform: translate(-50%, -50%) rotate(-45deg); }

      .gnb__list { display: block; }
      .gnb__list li { border-bottom: 1px solid rgba(0, 0, 0, 0.1); }
      .gnb__link {
        display: flex;
        align-items: center;
        height: 63px;
        font-size: 21px;
      }
      .gnb__apply {
        display: flex;
        width: 100%;
        height: 52px;
        margin: 44px 0 0;
        font-size: 19px;
        letter-spacing: -0.4px;
      }

      /* 메인 비주얼 */
      .mv__inner { padding: 100px 0 68px; }
      .mv__text { margin: 0 20px; gap: 48px; }
      .mv__info { gap: 16px; }
      .mv__season { font-size: 20px; line-height: 30px; letter-spacing: -0.42px; }
      .mv__title-em { font-size: 56px; line-height: 58px; letter-spacing: -1.37px; }
      .mv__title-sub { font-size: 35px; line-height: 56px; letter-spacing: -0.86px; }
      .mv__period { font-size: 12.5px; line-height: 20px; letter-spacing: -0.26px; }
      .btn--lg { width: 196px; height: 48px; font-size: 15px; letter-spacing: -0.32px; }

      .scroll-btn { width: 40px; height: 40px; bottom: 16px; }
      .scroll-btn .chevron-down { width: 24px; height: 24px; }
      .scroll-btn .chevron-down::after { width: 9px; height: 9px; border-width: 2px; }

      .footer__inner { flex-direction: column; align-items: flex-start; gap: 16px; padding: 32px 20px; }
    }
  </style>
</head>
<body>

  <!-- 사이트 헤더 -->
  <header class="header">
    <div class="header__inner">
      <a class="logo" href="./" aria-label="한미그룹 홈">
        <img src="./images/logo.svg" width="182" height="31" alt="Hanmi 한미그룹">
      </a>

      <nav class="gnb" id="gnb" aria-label="주요 메뉴">
        <button type="button" class="gnb__close" aria-label="메뉴 닫기"></button>
        <ul class="gnb__list">
          <li><a class="gnb__link" href="#jobs">직무소개</a></li>
          <li><a class="gnb__link" href="#qualification">지원자격 및 접수방법</a></li>
          <li><a class="gnb__link" href="#schedule">채용설명회 일정</a></li>
        </ul>
        <a class="btn btn--sm gnb__apply" href="#apply">
          지원하기
          <svg class="chevron" viewBox="0 0 7 12" fill="none" aria-hidden="true">
            <path d="M1 1l5 5-5 5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>
      </nav>

      <!-- 모바일 전용: 헤더 지원하기 + 햄버거 버튼 -->
      <a class="btn btn--sm header__apply" href="#apply">지원하기</a>
      <button type="button" class="gnb__toggle" aria-label="메뉴 열기" aria-expanded="false" aria-controls="gnb"></button>
    </div>
  </header>

  <!-- 본문 -->
  <main>
    <!-- 메인 비주얼 -->
    <section class="mv" id="main_visual" aria-labelledby="mv-title">
      <div class="mv__inner">

        <div class="mv__text">
          <header class="mv__info">
            <p class="mv__season">2026년 하반기</p>
            <h1 class="mv__title" id="mv-title">
              <span class="mv__title-em">한미그룹</span>
              <span class="mv__title-sub">공개채용</span>
            </h1>
            <p class="mv__period">모집기간 : <time datetime="2026-09-28">2026.9.28(월)</time> ~ <time datetime="2026-10-18T23:59">2026.10.18(일) 23:59</time>까지</p>
          </header>
          <a class="btn btn--lg" href="#jobs">모집직무 바로가기!</a>
        </div>

        <!-- 장식용 그래픽 (스크린리더 제외) -->
        <div class="mv__visual" aria-hidden="true">
          <div class="mv__glow"></div>
          <div class="mv__ring"></div>

          <img class="mv__micro" src="./images/mv_micro.png" alt="">
          <img class="mv__char1" src="./images/mv_char1.png" alt="">
          <img class="mv__char2" src="./images/mv_char2.png" alt="">
          <img class="mv__char3" src="./images/mv_char3.png" alt="">
          <img class="mv__char4" src="./images/mv_char4.png" alt="">

          <span class="star star--1"></span>
          <span class="star star--2"></span>
          <span class="star star--3"></span>
          <span class="star star--3b"></span>
          <span class="star star--4"></span>
        </div>

        <button type="button" class="scroll-btn" id="scrollBtn" aria-label="아래로 스크롤">
          <span class="chevron-down"></span>
        </button>
      </div>
    </section>
  </main>

  <!-- 사이트 푸터 -->
  <footer class="footer">
    <div class="footer__inner">
      <a class="footer__logo" href="./" aria-label="한미그룹 홈">
        <img src="./images/logo.svg" width="120" height="20" alt="Hanmi 한미그룹">
      </a>
      <p class="footer__copy">&copy; 2026 Hanmi Group. All rights reserved.</p>
    </div>
  </footer>

  <script>
    (function () {
      var btn = document.getElementById('scrollBtn');
      var mv = document.getElementById('main_visual');
      if (btn && mv) {
        btn.addEventListener('click', function () {
          window.scrollTo({ top: mv.offsetHeight, behavior: 'smooth' });
        });
      }
    })();

    /* 모바일 햄버거 메뉴 */
    (function () {
      var toggle = document.querySelector('.gnb__toggle');
      var menu = document.getElementById('gnb');
      var close = menu && menu.querySelector('.gnb__close');
      if (!toggle || !menu || !close) return;

      var root = document.documentElement;
      var mq = window.matchMedia('(max-width: 390px)');

      function setOpen(open, restoreFocus) {
        menu.classList.toggle('is-open', open);
        root.classList.toggle('menu-open', open);   // 배경 스크롤 잠금/해제
        toggle.setAttribute('aria-expanded', String(open));
        if (open) close.focus();
        else if (restoreFocus) toggle.focus();
      }

      toggle.addEventListener('click', function () { setOpen(true); });
      close.addEventListener('click', function () { setOpen(false, true); });

      // 메뉴 링크 클릭 시 닫기
      menu.addEventListener('click', function (e) {
        if (e.target.closest('a')) setOpen(false);
      });

      // ESC 로 닫기
      document.addEventListener('keydown', function (e) {
        if (e.key === 'Escape' && menu.classList.contains('is-open')) setOpen(false, true);
      });

      // 모바일 구간을 벗어나면 상태 초기화(스크롤 잠금 잔존 방지)
      function onChange(e) { if (!e.matches) setOpen(false); }
      if (mq.addEventListener) mq.addEventListener('change', onChange);
      else if (mq.addListener) mq.addListener(onChange);
    })();
  </script>
</body>
</html>
