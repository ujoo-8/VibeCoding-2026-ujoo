<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>산리오 코리아</title>
    <!-- 1. 상단영역 -->
    <!-- 인터널 스타일 시트(internal style sheet) -->
    <style>
      /* CDN은 Content Delivery Networt 즉, 네트워크망으로 콘텐트를 배달 시켜 쓰는 방식 */

      @import url("https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Nanum+Gothic&display=swap");
      @import url("https://cdn.jsdelivr.net/font-nanum/1.0/nanumbarungothic/nanumbarungothic.css");

      /* 프롬프트 : html,body, h1 등 margin, padding 초기화가 필요한 모든 요소를 초기화하는 셋팅을해. */
      /* 공통요소 초기화 기본 리셋 - html, body, h1 등 margin, padding을 모두 초기화 */
      html,
      body,
      div,
      span,
      applet,
      object,
      iframe,
      h1,
      h2,
      h3,
      h4,
      h5,
      h6,
      p,
      blockquote,
      pre,
      a,
      abbr,
      acronym,
      address,
      big,
      cite,
      code,
      del,
      dfn,
      em,
      img,
      ins,
      kbd,
      q,
      s,
      samp,
      small,
      strike,
      strong,
      sub,
      sup,
      tt,
      var,
      b,
      u,
      i,
      center,
      dl,
      dt,
      dd,
      ol,
      ul,
      li,
      fieldset,
      form,
      label,
      legend,
      table,
      caption,
      tbody,
      tfoot,
      thead,
      tr,
      th,
      td,
      article,
      aside,
      canvas,
      details,
      embed,
      figure,
      figcaption,
      footer,
      header,
      hgroup,
      main,
      menu,
      nav,
      output,
      ruby,
      section,
      summary,
      time,
      mark,
      audio,
      video {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html {
        /* rem단위를 위한 Root 글자 크기 설정 */
        font-size: 10px; /* 왜 10px인가? rem단위에 계산이 용이함! */
      }
      html,
      body {
        font-family:
          "Montserrat", "NanumBarunGothic", "Nanum Gothic", sans-serif;
        font-optical-sizing: auto;
        font-weight: 400;
        font-style: normal;
        width: 100%;
        height: 100%;
      }
      .header-area {
        background: #fff;
        padding: 0;
        vertical-align: middle;
      }

      .header-inner {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 20px 50px;
      }

      .header-logo {
        width: 180px;
      }
      .header-logo img {
        height: 52px;
        width: 100%;
      }

      .header-menu ul {
        display: flex;
        gap: 36px;
        list-style-type: none;
      }

      .header-menu a {
        display: inline-block;
        font-size: 1.6rem;
        font-weight: 500;
        color: #2b2b2b;
        text-decoration: none;
        padding: 8px 10px;
        text-transform: uppercase; /* 대문자 변환 */
        /* border-radius: 3px;
        transition: background 0.18s, color 0.18s; */
      }

      .header-menu a:hover {
        /* background: #faf1fb; */
        color: #f06292;
      }

      .banner-area {
        position: relative;
        padding: 100px;
        padding-bottom: 154px;
        background: url("./images/main_visual_bg.jpg") repeat 0 0 / 50px;
      }

      .main-visual-box {
        text-align: center;
      }

      .main-visual-img {
        /* opacity: 0;
        transform: translateY(-60px);
        transition:
          opacity 0.9s cubic-bezier(0.38, 1.02, 0.38, 1.06),
          transform 0.9s cubic-bezier(0.38, 1.02, 0.38, 1.06); */
        max-width: 100%;
        width: 984px;
      }

      .main-visual-img.visible {
        opacity: 1;
        transform: translateY(0);
      }

      .scroll_btn {
        position: absolute;
        bottom: 50px;
        left: 50%;
        translate: -50%;
        width: 79px;
        height: 70px;
        /* outline: 1px solid blue; */
      }

      .scroll_btn p {
        position: absolute;
        bottom: 0;
        width: 100%;
        text-align: center;
        text-transform: uppercase;
        font-size: 1rem;
      }
      /* 움직일 대상 마우스 */
      .scroll_btn .mouse {
        position: absolute;
        left: 50%;
        translate: -50%;
        top: 0;
        display: block;
        width: 26px;
        height: 36px;
        border: 2px solid #222;
        background: #fff;
        border-radius: 16px;
        /* 애니메이션 호출 : 이시이지반방마 (이름 시간 이징 지연시간 반복 방향 마지막상태) */
        animation: mouse-ani 0.9s ease-in-out infinite alternate; /* infinite를 반복횟수로 넣을 수 있음 (예:5) */
      }

      /* 마우스 애니메이션 키프레임 */
      @keyframes mouse-ani {
        /* 시작값 from이 처음 셋팅값과 같으면 생략가능 */
        from {
          top: 0;
        }
        to {
          top: 18px;
        }
      }

      .scroll_btn .mouse span {
        position: absolute;
        top: 28%;
        left: 50%;
        translate: -50% -50%;
        width: 4px;
        height: 4px;
        background-color: #222;
        border-radius: 50%;
        opacity: 0;
        animation: span-ani 2s ease-in-out infinite;
      }
      /* 미우스휠 애니메이션 프롬프트 
        span요소의 값 중 top값과 opacity값을 이용한 애니메이션을 구현할거야.
        전체 애니시간은 2초로해.
        처음엔 opacity값이 0에서 1로 변경되며 나타나
        다음엔 top값이 28%에서 50%로 변경됨
        다음엔 opacity값이 1에서 0으로 변경됨
        다음엔 0.5초간 기다리는 시간이 필요해
        그리고 애니메이션은 다시 처음부터 반복됨 */
      @keyframes span-ani {
        0% {
          opacity: 0;
          top: 28%;
        }
        10% {
          opacity: 1;
          top: 28%;
        }
        50% {
          opacity: 1;
          top: 50%;
        }
        60% {
          opacity: 0;
          top: 50%;
        }
        100% {
          opacity: 0;
          top: 50%;
        }
      }

      .sns {
        display: flex;
        flex-direction: column;
        position: absolute;
        right: 50px;
        top: 50px;
        z-index: 999;
      }
      /* 프롬프트 : .sns 박스 하위의 img 모두 가로,세로 크기를 40px적용해. */
      .sns img {
        width: 40px;
        height: 40px;
      }

      .character-area {
        height: 100vh;
      }

      .tit-box {
        max-width: 1200px;
        margin: 0 auto;
        outline: 1px dashed blue;
      }

      .tit-box .part-tit {
        text-align: center;
        padding: 40px 0 0;
        font-size: 5rem;
        font-weight: 500;
        text-transform: uppercase;
      }
      .btn_box {
        text-align: center;
        padding: 20px 0;
      }

      a.btn-view {
        border: 1px solid #222;
        padding: 10px 16px;
        border-radius: 50px;
        display: inline-block;
        text-decoration: none;
        text-transform: uppercase;
        color: #222;
        font-size: 1.2rem;
        font-weight: 400;
      }
    </style>
  </head>

  <body>
      <header class="header-area">
        <!-- 상단영역 -->
        <div class="header-inner">
          <!-- 로고 이미지 박스 -->
          <div class="header-logo">
            <img src="./images/logo_2023.png" alt="산리오 코리아 로고" />
          </div>
          <!-- 메뉴 리스트 -->
          <nav class="header-menu">
            <ul>
              <li><a href="#company">company</a></li>
              <li><a href="#character">character</a></li>
              <li><a href="#place">place</a></li>
              <li><a href="#recruit">recruit</a></li>
            </ul>
          </nav>
        </div>
      </header>
      

      <main class="main-area">
        <!-- 2-1. 배너영역 -->
        <section class="banner-area">
          <div class="main-visual-box">
            <img
              src="./images/main_visual_pc_v1.png"
              alt="메인 비주얼"
              class="main-visual-img"
              id="mainVisualImg"
            />
          </div>
          <!-- SNS이동버튼 -->
          <div class="sns">
            <a href="https://www.instagram.com/sanrio_kr/" target="_blank"
              ><img src="./images/i_ins_pc_v3.png" alt="instargram"
            /></a>
            <a
              href="https://www.youtube.com/c/sanriokorea/featured"
              target="_blank"
            >
              <img src="./images/i_you_pc_v3.png" />
            </a>
          </div>
          <!-- 스크롤 유도 애니박스 -->
          <!-- 프롬프트 : span요소의 값 중 top값과 opacity값을 이용한 애니메이션을 구현할거야.
          전체 애니시간은 1.5초로해.
          처음엔 opacity값이 0에서 1로 변경되며 나타나
          다음엔 top값이 27%에서 50%로 변경됨
          다음엔 opacity값이 1에서 0으로 변경됨
          다음엔 0.5초간 기다리는 시간이 필요해
          그리고 애니메이션은 다시 처음부터 반복됨 -->
          <div class="scroll_btn">
            <span class="mouse">
              <span></span>
            </span>
            <p>scroll down</p>
          </div>
        </section>
        <!-- 2-2. 캐릭터영역 -->
        <section class="character-area">
          <!-- .tit-box>h2.part-tit+.btn_box>a.btn-view[href="#"] Ctrl+스페이스바(예시를 보여줌) > 엔터 -->
          <div class="tit-box">
            <h2 class="part-tit">character</h2>
            <div class="btn_box">
              <a href="#" class="btn-view">veiw more</a>
            </div>
          </div>
        </section>
        <!-- 2-3. 컴퍼니영역 -->
        <section class="company-area">
          <!-- 컴퍼니영역: 여기에 내용이 들어갑니다 -->
        </section>
        <!-- 2-4. 리쿠르트영역 -->
        <section class="recruit-area">
          <!-- 리쿠르트영역: 여기에 내용이 들어갑니다 -->
        </section>
        <!-- 2-5. 플레이스영역 -->
        <section class="place-area">
          <!-- 플레이스영역: 여기에 내용이 들어갑니다 -->
        </section>
        <!-- 2-6. 컨텍어스영역 -->
        <section class="contactus-area">
          <!-- 컨텍어스영역: 여기에 내용이 들어갑니다 -->
        </section>
      </main>
      


      <footer class="footer-area">
        <!-- 하단영역: 여기에 내용이 들어갑니다 -->
      </footer>
    </main>

  </body>
</html>
